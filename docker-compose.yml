services:
  postgres:
    image: postgres:16-alpine
    container_name: workflow-capture-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: workflow_capture_ai
      POSTGRES_USER: workflow_capture_ai
      POSTGRES_PASSWORD: workflow_capture_ai
    ports:
      - "5432:5432"
    volumes:
      - workflow_capture_ai_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow_capture_ai -d workflow_capture_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  workflow_capture_ai_postgres:
